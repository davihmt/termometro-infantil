<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Termômetro de Comportamento</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>⚙️ Painel Admin</h1>
    <a class="btn-admin" href="index.html">🌡️ Ver termômetros</a>
  </header>

  <main class="admin">
    <!-- Cadastrar nova criança -->
    <section class="cartao">
      <h2>➕ Cadastrar criança</h2>
      <div class="linha-form">
        <input type="text" id="novoNome" placeholder="Nome da criança">
        <input type="number" id="novaIdade" placeholder="Idade" min="1" max="17">
        <button class="btn btn-verde" onclick="cadastrarCrianca()">Cadastrar</button>
      </div>
    </section>

    <!-- Lançar evento -->
    <section class="cartao">
      <h2>📝 Lançar evento</h2>
      <div class="linha-form">
        <select id="selCrianca"></select>
        <select id="selEvento"></select>
      </div>
      <div class="linha-form">
        <input type="text" id="txtNota" placeholder="Observação (opcional, ex: brigou com o irmão)">
        <button class="btn btn-azul" onclick="lancarEvento()">Lançar</button>
      </div>
      <button class="btn btn-cinza" onclick="desfazerUltimo()">↩️ Desfazer último evento</button>
    </section>

    <!-- Eventos de hoje -->
    <section class="cartao">
      <h2>📋 Eventos de hoje</h2>
      <div id="listaEventos" class="lista-eventos"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
