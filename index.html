<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ Heróis do Dia - Termômetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HERÓIS DO DIA - Tema Vingadores (arquivo único)
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --sombra: 0 10px 30px rgba(0,0,0,.5); }
body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh; color: #ece8f4; overflow-x: hidden;
  /* Imagem dos heróis ao fundo + véu escuro para legibilidade */
  background:
    linear-gradient(rgba(8,12,30,.90), rgba(8,12,30,.94)),
    url('fundo-herois.jpg') center top / cover no-repeat fixed,
    #0b1026;
}
.escondido { display: none !important; }

/* ===== Heróis ao fundo (decorações flutuantes) ===== */
.cenario { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.estrela {
  position: absolute; width: 2px; height: 2px; border-radius: 50%;
  background: rgba(255,255,255,.7); animation: brilhar 3s ease-in-out infinite;
}
@keyframes brilhar { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
.heroi-float {
  position: absolute; font-size: 2.6rem; opacity: .14; filter: saturate(.8);
  animation: flutuar 16s ease-in-out infinite;
}
.hf1 { top: 12%; left: 6%;  font-size: 4rem; }
.hf2 { top: 22%; right: 8%; animation-delay: -4s; }
.hf3 { top: 45%; left: 12%; animation-delay: -8s; font-size: 3.4rem; }
.hf4 { top: 60%; right: 14%; animation-delay: -12s; }
.hf5 { top: 78%; left: 22%; animation-delay: -6s; font-size: 3.6rem; }
.hf6 { top: 85%; right: 28%; animation-delay: -10s; }
@keyframes flutuar { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-26px) rotate(4deg); } }

/* Escudo do Capitão América desenhado em CSS */
.escudo {
  position: absolute; top: 6%; right: 4%; width: 130px; height: 130px;
  border-radius: 50%; opacity: .12;
  background: radial-gradient(circle,
    #3b82f6 0 18%, #ffffff 18% 30%, #dc2626 30% 55%,
    #ffffff 55% 67%, #dc2626 67% 100%);
  animation: girarLento 40s linear infinite;
}
.escudo::after {
  content: '★'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 2rem;
}
@keyframes girarLento { to { transform: rotate(360deg); } }

/* ===== Topo ===== */
.topo { position: relative; z-index: 1; text-align: center; padding: 30px 16px 8px; }
.titulo {
  font-family: 'Baloo 2', cursive; font-size: clamp(1.9rem, 5vw, 2.8rem);
  background: linear-gradient(135deg, #60a5fa, #f87171, #fbbf24);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.8));
}
.subtitulo { color: #a8b6d6; font-weight: 700; text-transform: capitalize; margin-top: 4px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }

.nav { display: flex; justify-content: center; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.nav button {
  font-family: 'Baloo 2', cursive; font-size: 1rem; border: none; cursor: pointer;
  padding: 10px 22px; border-radius: 30px; color: #c7d2ea;
  background: rgba(10,14,32,.7); border: 2px solid rgba(255,255,255,.15);
  transition: transform .15s;
}
.nav button:active { transform: translateY(2px); }
.nav button.ativa {
  background: linear-gradient(135deg, #2563eb, #dc2626); color: #fff;
  border-color: rgba(255,255,255,.35); box-shadow: 0 4px 18px rgba(37,99,235,.5);
}

/* ===== Grade de termômetros ===== */
.grade {
  position: relative; z-index: 1;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 28px;
  padding: 30px 16px 60px; max-width: 980px; margin: 0 auto;
}
.cartao-termometro {
  background: linear-gradient(160deg, rgba(24,33,60,.94), rgba(12,18,40,.96));
  border-radius: 28px; padding: 26px 22px; width: 225px; text-align: center;
  box-shadow: var(--sombra); border: 3px solid var(--heroi-cor, #3b82f6);
  animation: aparecer .5s ease backwards; transition: transform .25s;
}
.cartao-termometro:hover { transform: translateY(-6px); }
@keyframes aparecer { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; } }
.heroi-icone { font-size: 2.6rem; display: block; margin-bottom: 2px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
.cartao-termometro h2 { font-family: 'Baloo 2', cursive; font-size: 1.4rem; color: #fff; }
.idade { color: #93a5cc; font-size: .8rem; font-weight: 700; margin-bottom: 14px; }

/* Termômetro de energia do herói */
.termometro {
  position: relative; width: 74px; height: 250px; margin: 0 auto;
  background: rgba(255,255,255,.07); border: 4px solid rgba(255,255,255,.18);
  border-radius: 40px; overflow: hidden;
}
.liquido {
  position: absolute; bottom: 0; left: 0; right: 0;
  transition: height 1s cubic-bezier(.34,1.56,.64,1), background-color .8s;
  border-radius: 30px 30px 0 0;
  display: flex; justify-content: center;
  box-shadow: 0 -4px 18px rgba(255,255,255,.15) inset;
}
.liquido::before {
  content: ''; position: absolute; top: 10px; left: 12px;
  width: 10px; height: 10px; background: rgba(255,255,255,.5); border-radius: 50%;
  box-shadow: 26px 26px 0 rgba(255,255,255,.3), 8px 60px 0 rgba(255,255,255,.25);
}
.rosto { position: absolute; bottom: 8px; font-size: 1.8rem; animation: balancar 3s ease-in-out infinite; }
@keyframes balancar { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

.rotulo-nivel { margin-top: 16px; font-family: 'Baloo 2', cursive; font-size: 1.05rem; color: #fff; }
.pontos {
  display: inline-block; margin-top: 8px; padding: 4px 14px;
  background: rgba(255,255,255,.1); border-radius: 20px;
  font-weight: 800; font-size: .85rem; color: #c7d2ea;
}
.pontos.frio { background: rgba(239,68,68,.2); color: #fca5a5; }
.pontos.quente { background: rgba(34,197,94,.2); color: #86efac; }
.vazio { text-align: center; color: #a8b6d6; font-weight: 700; margin-top: 40px; width: 100%; }

/* ===== Comemoração nível 9 ===== */
.comemoracao {
  position: fixed; inset: 0; background: rgba(5,8,20,.78);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  animation: aparecer .3s ease;
}
.comemoracao-inner { text-align: center; }
.comemoracao-emoji { font-size: 6rem; display: inline-block; animation: pulsar .8s ease infinite alternate; }
.comemoracao-texto {
  font-family: 'Baloo 2', cursive; color: #fbbf24; font-size: 2.2rem;
  text-shadow: 0 4px 16px rgba(251,191,36,.5);
}
@keyframes pulsar { from { transform: scale(1) rotate(-8deg); } to { transform: scale(1.25) rotate(8deg); } }
.confete { position: absolute; top: -20px; font-size: 1.5rem; animation: cair 2.6s linear infinite; }
@keyframes cair { to { transform: translateY(110vh) rotate(720deg); } }

/* ===== Área Admin ===== */
.admin {
  position: relative; z-index: 1; max-width: 680px; margin: 0 auto;
  padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 22px;
}
.cartao {
  background: linear-gradient(160deg, rgba(24,33,60,.96), rgba(12,18,40,.97));
  border: 2px solid rgba(255,255,255,.14);
  border-radius: 24px; padding: 22px; box-shadow: var(--sombra);
  animation: aparecer .4s ease;
}
.cartao h2 { font-family: 'Baloo 2', cursive; color: #fff; font-size: 1.25rem; margin-bottom: 14px; }
.linha-form { display: flex; gap: 10px; flex-wrap: wrap; }
input, select {
  padding: 12px 14px; border: 2px solid rgba(255,255,255,.15); border-radius: 14px;
  font-size: 1rem; font-family: 'Nunito', sans-serif; flex: 1; min-width: 110px; outline: none;
  background: rgba(255,255,255,.07); color: #fff;
}
input::placeholder { color: #71809f; }
input:focus, select:focus { border-color: #60a5fa; }
select option { color: #111; }
.btn {
  border: none; border-radius: 14px; padding: 12px 20px;
  font-family: 'Baloo 2', cursive; font-size: 1rem; cursor: pointer; color: #fff;
  transition: transform .15s, box-shadow .15s; box-shadow: 0 4px 0 rgba(0,0,0,.3);
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn-verde { background: linear-gradient(135deg, #22c55e, #15803d); }
.btn-azul  { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
.btn-cinza { background: linear-gradient(135deg, #64748b, #334155); }
.msg { margin-top: 10px; font-weight: 700; font-size: .9rem; }
.msg.ok { color: #86efac; } .msg.erro { color: #fca5a5; }

/* Tela de senha */
.cartao-senha { max-width: 360px; margin: 40px auto; text-align: center; }
.cartao-senha .emoji { font-size: 3rem; }
.cartao-senha input { width: 100%; text-align: center; margin: 14px 0 12px; }
.cartao-senha p.dica { color: #93a5cc; font-size: .9rem; }
.erro-senha { color: #fca5a5; font-weight: 700; font-size: .9rem; margin-top: 8px; }

/* Chips de crianças */
.seletor-criancas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.chip-crianca {
  padding: 10px 18px; border-radius: 30px; background: rgba(255,255,255,.08);
  border: 3px solid transparent; font-family: 'Baloo 2', cursive; color: #c7d2ea;
  cursor: pointer; transition: all .2s;
}
.chip-crianca:hover { transform: scale(1.06); }
.chip-crianca.selecionada {
  background: linear-gradient(135deg, #2563eb, #dc2626); color: #fff;
  border-color: rgba(255,255,255,.5); box-shadow: 0 4px 14px rgba(37,99,235,.5);
}

/* Botões de evento grandes */
.grade-eventos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.btn-evento {
  border: none; border-radius: 16px; padding: 14px 10px;
  font-family: 'Baloo 2', cursive; font-size: .95rem; cursor: pointer; color: #fff;
  text-align: left; transition: transform .15s; box-shadow: 0 4px 0 rgba(0,0,0,.3);
}
.btn-evento:active { transform: translateY(3px); box-shadow: none; }
.btn-evento small { display: block; font-size: 1.1rem; font-weight: 800; }
.ev-pos-1 { background: linear-gradient(135deg, #4ade80, #16a34a); }
.ev-pos-2 { background: linear-gradient(135deg, #fbbf24, #d97706); }
.ev-neg-1 { background: linear-gradient(135deg, #fb923c, #c2410c); }
.ev-neg-2 { background: linear-gradient(135deg, #f87171, #b91c1c); }
.ev-neg-3 { background: linear-gradient(135deg, #a855f7, #6b21a8); }
.campo-nota { width: 100%; margin-bottom: 12px; }
.btn-desfazer { width: 100%; }

/* Lista de eventos */
.lista-eventos { display: flex; flex-direction: column; gap: 8px; }
.evento {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.06);
  font-size: .92rem; animation: aparecer .3s ease;
}
.evento .pts { font-weight: 800; font-size: 1rem; }
.pts.pos { color: #86efac; } .pts.neg { color: #fca5a5; }
.evento em { color: #93a5cc; }
.sem-eventos { color: #71809f; font-weight: 700; text-align: center; padding: 10px; }
.nome-selecionada { color: #93a5cc; font-size: 1rem; }

.rodape { position: relative; z-index: 1; text-align: center; color: #7c8bb0; font-size: .8rem; font-weight: 700; padding: 20px; }
</style>
</head>
<body>

<!-- Heróis ao fundo -->
<div class="cenario" id="cenario">
  <div class="escudo"></div>
  <span class="heroi-float hf1">🤖</span>
  <span class="heroi-float hf2">🕷️</span>
  <span class="heroi-float hf3">💚</span>
  <span class="heroi-float hf4">⚡</span>
  <span class="heroi-float hf5">🐆</span>
  <span class="heroi-float hf6">🛡️</span>
</div>

<header class="topo">
  <h1 class="titulo" id="tituloPagina">🛡️ HERÓIS DO DIA</h1>
  <p class="subtitulo" id="dataHoje"></p>
  <nav class="nav">
    <button id="abaTermometro" class="ativa" onclick="mostrarView('termometro')">🌡️ Termômetro</button>
    <button id="abaAdmin" onclick="mostrarView('admin')">⚙️ Área dos Pais</button>
  </nav>
</header>

<!-- ==================== VIEW: TERMÔMETROS ==================== -->
<main class="grade" id="viewTermometro"></main>

<!-- ==================== VIEW: ADMIN ==================== -->
<main class="admin escondido" id="viewAdmin">

  <section class="cartao cartao-senha" id="telaSenha">
    <span class="emoji">🔐</span>
    <h2>Área dos Pais</h2>
    <p class="dica">Digite a senha para continuar</p>
    <input type="password" id="campoSenha" placeholder="Senha" maxlength="20">
    <button class="btn btn-azul" style="width:100%" onclick="entrar()">Entrar</button>
    <p class="erro-senha escondido" id="erroSenha">Senha incorreta, tente de novo 😅</p>
  </section>

  <div id="painelAdmin" class="escondido" style="display:flex;flex-direction:column;gap:22px">

    <section class="cartao">
      <h2>➕ Cadastrar herói (criança)</h2>
      <div class="linha-form">
        <input type="text" id="novoNome" placeholder="Nome">
        <input type="number" id="novaIdade" placeholder="Idade" min="1" max="17">
      </div>
      <div class="linha-form" style="margin-top:10px">
        <select id="novoHeroi"></select>
        <button class="btn btn-verde" onclick="cadastrarCrianca()">Cadastrar</button>
      </div>
      <p id="msgCadastro" class="msg"></p>
    </section>

    <section class="cartao">
      <h2>📝 Lançar evento</h2>
      <div class="seletor-criancas" id="seletorCriancas"></div>
      <div class="grade-eventos" id="gradeEventos"></div>
      <input type="text" id="txtNota" class="campo-nota" placeholder="📝 Observação (opcional — ex: brigou com o irmão)">
      <button class="btn btn-cinza btn-desfazer" onclick="desfazerUltimo()">↩️ Desfazer último evento</button>
    </section>

    <section class="cartao">
      <h2>📋 Eventos de hoje <span id="nomeSelecionada" class="nome-selecionada"></span></h2>
      <div id="listaEventos" class="lista-eventos"></div>
    </section>

  </div>
</main>

<!-- Comemoração nível 9 -->
<div id="comemoracao" class="comemoracao escondido">
  <div class="comemoracao-inner">
    <span class="comemoracao-emoji">🏆</span>
    <p class="comemoracao-texto">DIA DE HERÓI!</p>
  </div>
</div>

<footer class="rodape">Atualiza sozinho em todos os aparelhos ✨</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   1) FIREBASE — CONFIGURAÇÃO (a PRIMEIRA coisa do script!)
   Cole suas chaves AQUI, dentro deste objeto:
   ============================================================ */
const firebaseConfig = {
  apiKey: "COLE_AQUI_SUA_API_KEY",
  authDomain: "termometro-infantil.firebaseapp.com",
  databaseURL: "https://termometro-infantil-default-rtdb.firebaseio.com",
  projectId: "termometro-infantil",
  storageBucket: "termometro-infantil.firebasestorage.app",
  messagingSenderId: "COLE_AQUI_SENDER_ID",
  appId: "COLE_AQUI_APP_ID"
};

const SENHA_ADMIN = 'goldo'; // 🔑 senha da área dos pais

// Inicializa o Firebase IMEDIATAMENTE (por isso o erro não acontece mais)
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

/* ============================================================
   2) OS HERÓIS — cada criança escolhe o seu no cadastro
   ============================================================ */
const HEROIS = {
  capitao: { nome: 'Capitão América', emoji: '🛡️', cor: '#3b82f6' },
  ferro:   { nome: 'Homem de Ferro',  emoji: '🤖', cor: '#ef4444' },
  aranha:  { nome: 'Homem-Aranha',    emoji: '🕷️', cor: '#dc2626' },
  hulk:    { nome: 'Hulk',            emoji: '💚', cor: '#22c55e' },
  thor:    { nome: 'Thor',            emoji: '⚡', cor: '#60a5fa' },
  pantera: { nome: 'Pantera Negra',   emoji: '🐆', cor: '#7c3aed' },
};

/* ============ 3) REGRAS: escala de 9 níveis (pontos -4 a +4) ============ */
const NIVEIS = {
  1: { nome: 'Dia difícil',        emoji: '😢', cor: '#b71c1c' },
  2: { nome: 'Muito difícil',      emoji: '😟', cor: '#e53935' },
  3: { nome: 'Comportamento ruim', emoji: '😕', cor: '#fb8c00' },
  4: { nome: 'Alerta amarelo',     emoji: '😐', cor: '#fbc02d' },
  5: { nome: 'Neutro',             emoji: '🙂', cor: '#fdd835' },
  6: { nome: 'Indo bem!',          emoji: '😊', cor: '#81c784' },
  7: { nome: 'Bom dia!',           emoji: '😄', cor: '#43a047' },
  8: { nome: 'Muito bem!',         emoji: '😁', cor: '#2e7d32' },
  9: { nome: 'DIA DE HERÓI!',      emoji: '🏆', cor: '#1b5e20' },
};
const PONTUACAO_MIN = -4, PONTUACAO_MAX = 4;

const TIPOS_EVENTO = [
  { id: 'tarefa',      label: 'Tarefa concluída',       pontos: +1, classe: 'ev-pos-1' },
  { id: 'positivo',    label: 'Comportamento positivo', pontos: +1, classe: 'ev-pos-1' },
  { id: 'excepcional', label: 'Atitude excepcional',    pontos: +2, classe: 'ev-pos-2' },
  { id: 'tarefa_nao',  label: 'Tarefa não feita',       pontos: -1, classe: 'ev-neg-1' },
  { id: 'ruim',        label: 'Comportamento ruim',     pontos: -2, classe: 'ev-neg-2' },
  { id: 'grave',       label: 'Comportamento grave',    pontos: -3, classe: 'ev-neg-3' },
];

/* ==================== 4) HELPERS ==================== */
function hoje() { return new Date().toLocaleDateString('sv-SE'); }
function nivelDe(p) { return Math.max(PONTUACAO_MIN, Math.min(PONTUACAO_MAX, p || 0)) + 5; }

async function garantirResetDiario(childId, crianca) {
  if (crianca.ultimoDia === hoje()) return;
  if (crianca.ultimoDia && typeof crianca.pontos === 'number') {
    await db.ref('historico/' + childId + '/' + crianca.ultimoDia).set({
      pontos: crianca.pontos, nivel: nivelDe(crianca.pontos)
    });
  }
  await db.ref('criancas/' + childId).update({ pontos: 0, ultimoDia: hoje() });
}

async function atualizarPontos(childId, pontosAtuais, delta) {
  const novos = Math.max(PONTUACAO_MIN, Math.min(PONTUACAO_MAX, (pontosAtuais || 0) + delta));
  await db.ref('criancas/' + childId + '/pontos').set(novos);
  return novos;
}

/* ==================== 5) INICIALIZAÇÃO DA PÁGINA ==================== */
document.getElementById('dataHoje').textContent =
  new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

// Estrelinhas no fundo
const cenario = document.getElementById('cenario');
for (let i = 0; i < 40; i++) {
  const s = document.createElement('span');
  s.className = 'estrela';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 100 + 'vh';
  s.style.animationDelay = Math.random() * 3 + 's';
  cenario.appendChild(s);
}

// Select de heróis no cadastro
const selHeroi = document.getElementById('novoHeroi');
Object.entries(HEROIS).forEach(([id, h]) => {
  const opt = document.createElement('option');
  opt.value = id;
  opt.textContent = h.emoji + ' ' + h.nome;
  selHeroi.appendChild(opt);
});

// Botões de evento
const gradeEventos = document.getElementById('gradeEventos');
TIPOS_EVENTO.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'btn-evento ' + t.classe;
  btn.innerHTML = t.label + '<small>' + (t.pontos > 0 ? '+' : '') + t.pontos + '</small>';
  btn.onclick = () => lancarEvento(t);
  gradeEventos.appendChild(btn);
});

// Verifica se as chaves foram coladas
const configOk = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('COLE_AQUI')
  && firebaseConfig.messagingSenderId && !firebaseConfig.messagingSenderId.includes('COLE_AQUI');

if (!configOk) {
  document.getElementById('viewTermometro').innerHTML =
    '<p class="vazio">⚠️ <b>Firebase ainda não configurado!</b><br>Abra este arquivo no VS Code e cole suas chaves no objeto <b>firebaseConfig</b> (primeira seção do script).</p>';
}

/* ==================== NAVEGAÇÃO ==================== */
function mostrarView(view) {
  const isAdminView = view === 'admin';
  document.getElementById('viewTermometro').classList.toggle('escondido', isAdminView);
  document.getElementById('viewAdmin').classList.toggle('escondido', !isAdminView);
  document.getElementById('abaTermometro').classList.toggle('ativa', !isAdminView);
  document.getElementById('abaAdmin').classList.toggle('ativa', isAdminView);
  document.getElementById('tituloPagina').textContent = isAdminView ? '⚙️ Área dos Pais' : '🛡️ HERÓIS DO DIA';
  if (isAdminView && sessionStorage.getItem('adminOk') === 'sim') {
    document.getElementById('telaSenha').classList.add('escondido');
    document.getElementById('painelAdmin').classList.remove('escondido');
  }
}

/* ==================== TERMÔMETROS (TEMPO REAL) ==================== */
const grade = document.getElementById('viewTermometro');
const seletor = document.getElementById('seletorCriancas');
const listaEventos = document.getElementById('listaEventos');
var criancaSelecionada = null;
var teveNivel9 = false;

if (configOk) {
  db.ref('criancas').on('value', async (snapshot) => {
    const dados = snapshot.val();
    grade.innerHTML = '';
    seletor.innerHTML = '';

    if (!dados) {
      grade.innerHTML = '<p class="vazio">Nenhum herói cadastrado ainda.<br>Peça para os pais cadastrarem na área ⚙️</p>';
      seletor.innerHTML = '<p class="sem-eventos">Cadastre o primeiro herói acima 👆</p>';
      criancaSelecionada = null;
      return;
    }

    for (const [id, crianca] of Object.entries(dados)) {
      await garantirResetDiario(id, crianca);
      const pontos = (crianca.ultimoDia === hoje()) ? (crianca.pontos || 0) : 0;
      const nivel = nivelDe(pontos);
      grade.appendChild(criarTermometro(crianca, nivel, pontos));
      criarChip(id, crianca);
    }

    if (!criancaSelecionada || !dados[criancaSelecionada]) {
      criancaSelecionada = Object.keys(dados)[0];
      const chip = seletor.querySelector('.chip-crianca');
      if (chip) chip.classList.add('selecionada');
      document.getElementById('nomeSelecionada').textContent = '— ' + dados[criancaSelecionada].nome;
    }
    carregarEventos();
  });
}

function criarTermometro(crianca, nivel, pontos) {
  const heroi = HEROIS[crianca.heroi] || HEROIS.capitao;
  const cartao = document.createElement('div');
  cartao.className = 'cartao-termometro';
  cartao.style.setProperty('--heroi-cor', heroi.cor);

  const icone = document.createElement('span');
  icone.className = 'heroi-icone';
  icone.textContent = heroi.emoji;
  cartao.appendChild(icone);

  const titulo = document.createElement('h2');
  titulo.textContent = crianca.nome;
  cartao.appendChild(titulo);

  const idade = document.createElement('p');
  idade.className = 'idade';
  idade.textContent = (crianca.idade ? crianca.idade + ' anos · ' : '') + heroi.nome;
  cartao.appendChild(idade);

  const term = document.createElement('div');
  term.className = 'termometro';
  const liquido = document.createElement('div');
  liquido.className = 'liquido';
  liquido.style.height = (nivel / 9) * 100 + '%';
  liquido.style.background = 'linear-gradient(180deg,' + NIVEIS[nivel].cor + ',' + NIVEIS[Math.max(1, nivel - 1)].cor + ')';
  const rosto = document.createElement('span');
  rosto.className = 'rosto';
  rosto.textContent = NIVEIS[nivel].emoji;
  liquido.appendChild(rosto);
  term.appendChild(liquido);
  cartao.appendChild(term);

  const rotulo = document.createElement('p');
  rotulo.className = 'rotulo-nivel';
  rotulo.textContent = NIVEIS[nivel].nome;
  cartao.appendChild(rotulo);

  const pts = document.createElement('span');
  pts.className = 'pontos' + (pontos > 0 ? ' quente' : pontos < 0 ? ' frio' : '');
  pts.textContent = (pontos > 0 ? '+' : '') + pontos + ' ponto' + (pontos === 1 || pontos === -1 ? '' : 's');
  cartao.appendChild(pts);

  if (nivel === 9 && !teveNivel9) { teveNivel9 = true; comemorar(crianca.nome); }
  if (nivel < 9) teveNivel9 = false;

  return cartao;
}

function comemorar(nome) {
  const tela = document.getElementById('comemoracao');
  tela.querySelector('.comemoracao-texto').textContent = nome.toUpperCase() + ' — DIA DE HERÓI!';
  tela.classList.remove('escondido');
  const emojis = ['🎉', '🏆', '⭐', '🛡️', '⚡', '🎊', '💥'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('span');
    c.className = 'confete';
    c.textContent = emojis[i % emojis.length];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDelay = Math.random() * 2 + 's';
    tela.appendChild(c);
  }
  setTimeout(() => {
    tela.classList.add('escondido');
    tela.querySelectorAll('.confete').forEach(c => c.remove());
  }, 4000);
}

/* ==================== SENHA ==================== */
function entrar() {
  if (document.getElementById('campoSenha').value === SENHA_ADMIN) {
    sessionStorage.setItem('adminOk', 'sim');
    document.getElementById('telaSenha').classList.add('escondido');
    document.getElementById('painelAdmin').classList.remove('escondido');
  } else {
    document.getElementById('erroSenha').classList.remove('escondido');
    document.getElementById('campoSenha').value = '';
  }
}
document.getElementById('campoSenha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

/* ==================== CADASTRO ==================== */
async function cadastrarCrianca() {
  const msg = document.getElementById('msgCadastro');
  if (!configOk) {
    msg.textContent = '⚠️ Configure o Firebase primeiro (objeto firebaseConfig no topo do script).';
    msg.className = 'msg erro';
    return;
  }
  const nome = document.getElementById('novoNome').value.trim();
  const idade = parseInt(document.getElementById('novaIdade').value);
  const heroi = document.getElementById('novoHeroi').value;
  if (!nome) { msg.textContent = 'Digite o nome da criança.'; msg.className = 'msg erro'; return; }
  try {
    await db.ref('criancas').push({ nome, idade: idade || null, heroi, pontos: 0, ultimoDia: hoje() });
    document.getElementById('novoNome').value = '';
    document.getElementById('novaIdade').value = '';
    msg.textContent = '✅ ' + nome + ' entrou para a equipe ' + HEROIS[heroi].nome + '!';
    msg.className = 'msg ok';
  } catch (e) {
    msg.textContent = '❌ Erro: ' + e.message;
    msg.className = 'msg erro';
  }
}

function criarChip(id, crianca) {
  const heroi = HEROIS[crianca.heroi] || HEROIS.capitao;
  const chip = document.createElement('button');
  chip.className = 'chip-crianca' + (id === criancaSelecionada ? ' selecionada' : '');
  chip.textContent = heroi.emoji + ' ' + crianca.nome;
  chip.onclick = () => {
    criancaSelecionada = id;
    seletor.querySelectorAll('.chip-crianca').forEach(c => c.classList.remove('selecionada'));
    chip.classList.add('selecionada');
    document.getElementById('nomeSelecionada').textContent = '— ' + crianca.nome;
    carregarEventos();
  };
  seletor.appendChild(chip);
}

/* ==================== EVENTOS ==================== */
async function lancarEvento(tipo) {
  if (!criancaSelecionada) { alert('Selecione uma criança primeiro.'); return; }
  const nota = document.getElementById('txtNota').value.trim();

  const snap = await db.ref('criancas/' + criancaSelecionada).get();
  const crianca = snap.val();
  if (!crianca) return;

  await garantirResetDiario(criancaSelecionada, crianca);
  const pontosAtuais = (await db.ref('criancas/' + criancaSelecionada + '/pontos').get()).val() || 0;

  const novoEvento = await db.ref('eventos/' + criancaSelecionada + '/' + hoje()).push({
    tipo: tipo.id, label: tipo.label, pontos: tipo.pontos, nota,
    hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  });

  await db.ref('ultimoEvento/' + criancaSelecionada).set(novoEvento.key);
  await atualizarPontos(criancaSelecionada, pontosAtuais, tipo.pontos);
  document.getElementById('txtNota').value = '';
}

async function desfazerUltimo() {
  if (!criancaSelecionada) return;
  const keySnap = await db.ref('ultimoEvento/' + criancaSelecionada).get();
  const eventoKey = keySnap.val();
  if (!eventoKey) { alert('Nenhum evento para desfazer hoje.'); return; }

  const evSnap = await db.ref('eventos/' + criancaSelecionada + '/' + hoje() + '/' + eventoKey).get();
  const evento = evSnap.val();
  if (!evento) { alert('Evento não encontrado.'); return; }

  const pontosAtuais = (await db.ref('criancas/' + criancaSelecionada + '/pontos').get()).val() || 0;
  await db.ref('eventos/' + criancaSelecionada + '/' + hoje() + '/' + eventoKey).remove();
  await db.ref('ultimoEvento/' + criancaSelecionada).remove();
  await atualizarPontos(criancaSelecionada, pontosAtuais, -evento.pontos);
}

function carregarEventos() {
  listaEventos.innerHTML = '<p class="sem-eventos">Carregando...</p>';
  if (!criancaSelecionada) { listaEventos.innerHTML = ''; return; }

  db.ref('eventos/' + criancaSelecionada + '/' + hoje()).on('value', (snapshot) => {
    const dados = snapshot.val();
    listaEventos.innerHTML = '';
    if (!dados) { listaEventos.innerHTML = '<p class="sem-eventos">Nenhum evento hoje ainda.</p>'; return; }
    Object.entries(dados).reverse().forEach(([id, ev]) => {
      const div = document.createElement('div');
      div.className = 'evento';
      const classe = ev.pontos > 0 ? 'pos' : 'neg';
      div.innerHTML = '<span>' + ev.hora + ' — ' + ev.label + (ev.nota ? ' <em>(' + ev.nota + ')</em>' : '') + '</span>' +
        '<span class="pts ' + classe + '">' + (ev.pontos > 0 ? '+' : '') + ev.pontos + '</span>';
      listaEventos.appendChild(div);
    });
  });
}
</script>
